spring.application.name=ms-wishlist
server.port=9093

# Nivel global
logging.level.root=INFO

# Tu package
logging.level.com.example.ms_wishlist=DEBUG

# Archivo de logs
logging.file.name=logs/ms-wishlist.log

# Configuración de base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/db_wishlist
spring.datasource.username=root
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=una_clave_secreta_larga_y_segura_de_al_menos_32_bytes

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true