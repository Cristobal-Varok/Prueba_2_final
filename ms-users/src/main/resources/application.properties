spring.application.name=ms-users
# Puerto
server.port=9090

# Nivel global
logging.level.root=INFO

# Tu package
logging.level.com.example.ms_users=DEBUG

# Archivo de logs
logging.file.name=logs/ms-users.log

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/db_auth
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=una_clave_secreta_larga_y_segura_de_al_menos_32_bytes
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true